name: Renovate

on:
  schedule:
    - cron: '7 15 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v47.0.0
        with:
          configurationFile: config.js
          # Exact, not the action's floating default `44`: ci.yml validates
          # config.js with this same version (RENOVATE_VERSION there), so the
          # validator that judges the config and the engine that runs it
          # agree. Raise both together.
          renovate-version: 44.255.1
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
